name: mish

# Every credential below is required. Compose fails with a named error rather than starting the
# stack with a default password, so a missing value can never reach a running deployment.

services:
  # Application data and uploaded model binaries (GridFS). Not published: only the app talks to it.
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}",
             "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Identity provider. Realms (roles, the client and the users) are imported on first start only;
  # afterwards Keycloak's own database is the source of truth.
  #
  # The start command comes from .env and has no default. Development uses `start-dev` together with
  # --import-realm; production must use `start`, which keeps the hostname and health checks that
  # start-dev switches off, and which leaves the demo realms unimported.
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    restart: unless-stopped
    command: ${KEYCLOAK_COMMAND:?set KEYCLOAK_COMMAND in .env}
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Keycloak sits behind the gateway, so it must advertise the browser-facing URL, not its own.
      KC_PROXY: edge
      KC_HOSTNAME_URL: ${EXTERNAL_BASE_URL:?set EXTERNAL_BASE_URL in .env}/auth
      KC_HOSTNAME_ADMIN_URL: ${EXTERNAL_BASE_URL}/auth
      # The public URL above is fixed, so refuse to derive any advertised URL from request headers:
      # a forged Host header must not steer the issuer, the login redirect or — via the discovery
      # document — the endpoint a client posts its authorization code and secret to.
      # Both settings only govern the URLs Keycloak advertises. The application does not read the
      # discovery document; it is configured to reach Keycloak in-network on http://keycloak:8080,
      # and that keeps working.
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The MISH application: Vaadin UI and the backend in one process.
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:?set MONGO_DB in .env}?authSource=admin
      # Browser-facing, used to build the login redirect.
      KEYCLOAK_EXTERNAL_URL: ${EXTERNAL_BASE_URL}/auth
      # Container-to-container, used for token, JWKS and userinfo calls.
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?set KEYCLOAK_REALM in .env}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?set KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}
      EXTERNAL_GATEWAY_URL: ${EXTERNAL_BASE_URL}
      EXTERNAL_REDIRECT_URI: ${EXTERNAL_BASE_URL}/login/oauth2/code/keycloak
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      # The runtime image ships dash as /bin/sh, which has no /dev/tcp; bash does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Creates a self-signed certificate for the gateway on first run.
  # Replace the files in the gateway-certs volume to use a real certificate.
  cert-init:
    image: eclipse-temurin:21-jre
    command:
      - sh
      - -c
      - >
        test -f /certs/fullchain.pem ||
        openssl req -x509 -nodes -days 825 -newkey rsa:2048
        -subj "/C=CZ/ST=Hradec Kralove/L=Hradec Kralove/O=UHK/OU=FIM/CN=${EXTERNAL_HOSTNAME:?set EXTERNAL_HOSTNAME in .env}"
        -addext "subjectAltName=DNS:${EXTERNAL_HOSTNAME},DNS:mish,DNS:localhost,IP:127.0.0.1"
        -keyout /certs/privkey.pem -out /certs/fullchain.pem
    volumes:
      - gateway-certs:/certs

  # TLS termination and the single entry point for the browser.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      app:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway-certs:/etc/nginx/ssl:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      default:
        aliases:
          # Lets containers reach the app under the same hostname the browser uses,
          # which is what keeps Keycloak's issuer consistent on both sides.
          - mish

volumes:
  mongo-data:
  keycloak-db-data:
  gateway-certs:
