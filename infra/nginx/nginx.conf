worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    # 3D models and their textures are large; this is the effective upload ceiling for the stack.
    client_max_body_size 200M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the port the browser used, so redirects built by Keycloak and Vaadin point back at it.
    map $http_host $forwarded_port {
        default             443;
        "~^[^:]+:(?<p>\d+)$" $p;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$http_host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Everything is served over TLS, so pin browsers to it and block the framing and
        # content-sniffing tricks that turn a content bug into an account compromise.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_set_header X-Forwarded-Proto https;

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            # Keycloak advertises http:// locations behind the proxy; rewrite them back to https.
            proxy_redirect ~^http://[^/]+/auth/(.*)$ https://$http_host/auth/$1;
        }

        # Vaadin's server push channel; the long timeouts keep idle sessions from being cut.
        location /VAADIN/push {
            proxy_pass http://app:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location / {
            proxy_pass http://app:8081;
        }
    }
}
