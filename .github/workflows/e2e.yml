name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ main, monolith ]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Map gateway hostname
        run: echo "127.0.0.1 mish" | sudo tee -a /etc/hosts

      - name: Configure the stack
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i 's|^EXTERNAL_BASE_URL=.*|EXTERNAL_BASE_URL=https://mish|' .env
          sed -i 's|^EXTERNAL_HOSTNAME=.*|EXTERNAL_HOSTNAME=mish|' .env

      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build --wait

      - name: Wait for the gateway
        run: timeout 300 bash -c 'until curl -ksf https://mish >/dev/null; do sleep 5; done'

      - name: Wait for Keycloak
        run: timeout 300 bash -c 'until curl -ksf https://mish/auth/realms/mock-realm >/dev/null; do sleep 5; done'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No file list: positional filters apply to every project, so naming the specs would leave the
      # `setup` project matching nothing and the fixtures unseeded. The `e2e` project already
      # excludes the setup and perf specs, and pulls `setup` in as a dependency.
      - name: Run e2e tests
        env:
          E2E_BASE_URL: https://mish
        run: npx playwright test --project=e2e --workers=1

      - name: Upload usability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-report
          path: test-results/usability-report.md
          if-no-files-found: ignore

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

      - name: Dump stack state on failure
        if: failure()
        working-directory: infra
        run: |
          docker compose ps
          docker compose logs --tail 200
