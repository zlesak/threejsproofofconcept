name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ main, monolith ]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Map gateway hostname
        run: echo "127.0.0.1 mish" | sudo tee -a /etc/hosts

      - name: Configure the stack
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i 's|^EXTERNAL_BASE_URL=.*|EXTERNAL_BASE_URL=https://mish|' .env
          sed -i 's|^EXTERNAL_HOSTNAME=.*|EXTERNAL_HOSTNAME=mish|' .env

      # The suite must exercise the frontend and backend in this repository. They are one image, so
      # the check is that `app` is built here rather than pulled: an override file swapping in a
      # registry tag, or a stray `image:`, would silently test something else.
      - name: Verify the stack builds the in-repo application
        working-directory: infra
        run: |
          docker compose config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys
          app = json.load(open('/tmp/compose.json'))['services']['app']
          if 'build' not in app:
              sys.exit('app is not built from this repository: %s' % app.get('image', '<no image>'))
          print('app builds from', app['build']['context'], 'via', app['build']['dockerfile'])
          PY

      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build --wait

      - name: Wait for the gateway
        run: timeout 300 bash -c 'until curl -ksf https://mish >/dev/null; do sleep 5; done'

      - name: Wait for Keycloak
        run: timeout 300 bash -c 'until curl -ksf https://mish/auth/realms/mock-realm >/dev/null; do sleep 5; done'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No file list: positional filters apply to every project, so naming the specs would leave the
      # `setup` project matching nothing and the fixtures unseeded. Projects carry their own
      # selection and dependencies — setup seeds, e2e runs in parallel, usability runs after it
      # alone so its timings are not measured under load.
      - name: Run e2e tests
        env:
          E2E_BASE_URL: https://mish
        run: npx playwright test --project=e2e

      # Separate invocation with a single worker: the report measures how long each task takes, and
      # that number is only meaningful when nothing else is competing for the machine. `always()`
      # because a failing functional suite is exactly when the walkthrough is worth reading.
      - name: Measure the usability walkthrough
        if: always()
        env:
          E2E_BASE_URL: https://mish
          E2E_WORKERS: 1
        run: npx playwright test --project=usability

      - name: Upload usability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-report
          path: test-results/usability-report.md
          if-no-files-found: ignore

      # Machine-readable results, kept so a run can be imported into a test-management tool later
      # without changing anything about the tests. See docs/test-scenarios.md.
      - name: Upload machine-readable results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results/results.xml
          if-no-files-found: ignore

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

      - name: Dump stack state on failure
        if: failure()
        working-directory: infra
        run: |
          docker compose ps
          docker compose logs --tail 200
