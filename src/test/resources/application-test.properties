vaadin.launch-browser=false
spring.main.allow-bean-definition-overriding=true

# Obviously-fake values: the UI test suite never reaches MongoDB or Keycloak, and the short
# timeouts keep the one start-up index check from stalling when no database is running.
spring.mongodb.uri=mongodb://localhost:27017/mish-test?serverSelectionTimeoutMS=200&connectTimeoutMS=200
spring.data.mongodb.auto-index-creation=false
server.servlet.session.cookie.secure=false

KEYCLOAK_CLIENT_ID=test-client
KEYCLOAK_CLIENT_SECRET=test-secret
KEYCLOAK_URL=http://localhost/mock
KEYCLOAK_EXTERNAL_URL=http://localhost/mock
KEYCLOAK_REALM=test-realm

spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost/mock-auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost/mock-token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost/mock-userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost/mock-jwks
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
