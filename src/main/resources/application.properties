server.port=${PORT:8081}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Connection details and credentials have no defaults on purpose: the application fails to start
# rather than silently falling back to a development database or a shared client secret.
# Spring Boot 4 reads the connection from spring.mongodb.*; spring.data.mongodb.* holds the
# Spring Data settings on top of it.
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

vaadin.launch-browser=true
vaadin.frontend.hotdeploy=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,cz.uhk.zlesak.threejslearningapp,com.flowingcode
spring.web.resources.static-locations=classpath:/static/,file:/app/webapp/

# Max file size (per file)
spring.servlet.multipart.max-file-size=150MB

# Max request size (total for all files + form data)
spring.servlet.multipart.max-request-size=180MB

# Keycloak OAuth2 Configuration
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
# The browser is sent to KEYCLOAK_EXTERNAL_URL; the application itself talks to KEYCLOAK_URL.
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_EXTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.registration.keycloak.redirect-uri=${EXTERNAL_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# Logging. On a developer machine the console stays human-readable; the container sets
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs, which switches Spring Boot to one JSON object per line in
# Elastic Common Schema — the shape both an ELK stack and Grafana/Loki read without extra mapping.
# MDC (trace.id, user.id) is included automatically, so every line can be traced back to a request.
logging.include-application-name=false
logging.level.mish.audit=INFO

# Health is the only actuator endpoint exposed, and it reports no detail to an anonymous caller.
# The liveness and readiness groups are what Kubernetes probes ask for: readiness takes a pod out of
# rotation during a rolling update, liveness restarts one that has wedged.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

documentation.storage.path=frontend/repo/src/main/resources/texts/doc
server.forward-headers-strategy=framework

# The gateway terminates TLS, so the session cookie must not travel over plain HTTP.
# Only set this to false when running the application directly over http during development.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
